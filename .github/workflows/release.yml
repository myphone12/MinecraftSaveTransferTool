name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Build App
        uses: ./.github/workflows/build-app.yml
    
      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Rename
        run: |
          mkdir -p app
          for dir in ./app-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                app_platform_name=$(basename "$dir")
                if [ -f "$dir/app" ]; then
                  mv "$dir/app" "app/$app_platform_name"
                elif [ -f "$dir/app.exe" ]; then
                  mv "$dir/app.exe" "app/$app_platform_name.exe"
                fi
            fi
          done

      - name: Display structure of downloaded files
        run: ls -R

      - name: release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app/*